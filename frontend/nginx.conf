
# Normaliza la ruta pública utilizando el subdirectorio configurado.
# Si APP_BASE_PATH está vacío, las rutas permanecen en la raíz.
map $uri $app_internal_uri {
    volatile;
    ~^${APP_BASE_PATH}(?:/(.*))?$ /$1;
    default $uri;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;

    # Retirar el subdirectorio antes de procesar cualquier solicitud.
    if ($uri != $app_internal_uri) {
        rewrite ^ $app_internal_uri last;
    }

    # WEBSOCKETS - Django Channels
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ARCHIVOS ESTÁTICOS
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 7d;
    }

    # ARCHIVOS MULTIMEDIA
    location /media/ {
        alias /var/www/media/;
        add_header X-Content-Type-Options nosniff;
    }

    # API REST - DJANGO
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ADMINISTRACIÓN DJANGO
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # FRONTEND - REACT ROUTER
    location / {
        try_files $uri $uri/ /index.html;
    }
}
