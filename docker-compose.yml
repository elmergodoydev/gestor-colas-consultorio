name: gestor-colas-sihce

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - interna

  piper-tts:
    build:
      context: ./piper-tts
      dockerfile: Dockerfile
    image: gestor-colas-piper:davefx-medium
    restart: unless-stopped
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/info', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - interna

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      PIPER_TTS_URL: ${PIPER_TTS_URL:-http://piper-tts:5000/synthesize}
    volumes:
      - static_files:/app/staticfiles
      - media_data:/app/media
    networks:
      - interna
    depends_on:
      redis:
        condition: service_healthy
      piper-tts:
        condition: service_healthy
    expose:
      - "8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  frontend:
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP}:${APP_PORT}:80"
    volumes:
      - static_files:/usr/share/nginx/html/static:ro
      - media_data:/var/www/media:ro
    networks:
      - interna
    depends_on:
      - backend

networks:
  interna:
    driver: bridge

volumes:
  static_files:
  media_data:
