
name: gestor-colas-sihce

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - interna

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - static_files:/app/staticfiles
      - media_data:/app/media
    networks:
      - interna
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application

  frontend:
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-}
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP}:${APP_PORT}:80"
    volumes:
      - static_files:/usr/share/nginx/html/static:ro
      - media_data:/var/www/media:ro
    networks:
      - interna
    depends_on:
      - backend

networks:
  interna:
    driver: bridge

volumes:
  static_files:
  media_data:
